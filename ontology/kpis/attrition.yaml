# ============================================================
# KPI Recipes: Attrition Domain
# Source view: AGGEMPCOUNT_ATTRITION_DATA_V
# Formula: (TOTAL_TERMINATION / EMPLOYEE_HEADCOUNT_ATTRITION)
#            * (365.0 / DATEDIFF(day, MIN(DATE), MAX(DATE))) * 100
#
# Two KPIs:
#   kpi_attrition_rate_simple  — station/period summary (fast)
#   kpi_attrition_rate_detail  — CTE breakdown by station + cost center
# ============================================================

domain: Attrition
data_source: AGGEMPCOUNT_ATTRITION_DATA_V
description: "Annualized employee attrition/turnover rate from pre-aggregated headcount and termination counts"

kpis:
  - id: kpi_attrition_rate_simple
    name: "Attrition Rate"
    description: "Annualized attrition rate = (Total Terminations / Total Headcount) x (365 / Days in Period) x 100. Filtered by station and/or time period."
    complexity: medium
    formula: "(SUM(TOTAL_TERMINATION) / NULLIF(SUM(EMPLOYEE_HEADCOUNT_ATTRITION), 0)) * (365.0 / GREATEST(DATEDIFF(day, MIN(DATE), MAX(DATE)), 1)) * 100 AS ATTRITION_RATE_PCT"
    views: [AGGEMPCOUNT_ATTRITION_DATA_V]
    steps:
      - order: 1
        name: "apply_filters"
        logic: "Filter rows from AGGEMPCOUNT_ATTRITION_DATA_V by DATE range and/or STATIONCODE using WHERE clause. If no period filter is given, use all available dates."
        required_columns: [DATE, STATIONCODE, COSTCENTER]
      - order: 2
        name: "sum_numerator_denominator"
        logic: "SUM(TOTAL_TERMINATION) as total terminations (numerator). SUM(EMPLOYEE_HEADCOUNT_ATTRITION) as total headcount (denominator). Use NULLIF to prevent divide-by-zero."
        required_columns: [TOTAL_TERMINATION, EMPLOYEE_HEADCOUNT_ATTRITION]
      - order: 3
        name: "compute_period_days"
        logic: "Compute DATEDIFF(day, MIN(DATE), MAX(DATE)) + 1 as days in the reporting period for annualization. Use GREATEST(..., 1) to avoid division by zero for single-day ranges."
        required_columns: [DATE]
      - order: 4
        name: "annualize_rate"
        logic: "Multiply ratio by (365.0 / days_in_period) * 100 to produce an annualized percentage. Output as ATTRITION_RATE_PCT rounded to 2 decimal places."
        required_columns: [TOTAL_TERMINATION, EMPLOYEE_HEADCOUNT_ATTRITION, DATE]
    filters:
      - { column: DATE, source: detected_period, operator: ">=" }
      - { column: STATIONCODE, source: detected_station, operator: "=" }
      - { column: COSTCENTER, source: detected_costcenter, operator: "=" }
    output_shape:
      type: aggregate
      columns: [STATIONCODE, TOTAL_TERMINATIONS, TOTAL_HEADCOUNT, DAYS_IN_PERIOD, ATTRITION_RATE_PCT]
      order_by: [STATIONCODE]
    synonyms:
      - "attrition rate"
      - "attrition"
      - "turnover rate"
      - "turnover"
      - "termination rate"
      - "how many left"
      - "who left"
      - "employees left"
      - "attrition by station"
      - "what is attrition"
      - "show attrition"
    version: "1.0"
    status: active
    owner: data_team
    valid_from: "2026-05-28"

  - id: kpi_attrition_rate_detail
    name: "Attrition Rate Detail"
    description: "Detailed annualized attrition rate broken down by station AND cost center using a multi-step CTE. Includes period bounds, termination counts, headcount, and final rate."
    complexity: very_high
    formula: |
      WITH period_data AS (
        SELECT STATIONCODE, COSTCENTER,
               SUM(TOTAL_TERMINATION) AS TOTAL_TERMINATIONS,
               SUM(EMPLOYEE_HEADCOUNT_ATTRITION) AS TOTAL_HEADCOUNT,
               MIN(DATE) AS PERIOD_START,
               MAX(DATE) AS PERIOD_END,
               GREATEST(DATEDIFF(day, MIN(DATE), MAX(DATE)), 1) AS DAYS_IN_PERIOD
        FROM AGGEMPCOUNT_ATTRITION_DATA_V
        WHERE {date_filter}
        GROUP BY STATIONCODE, COSTCENTER
      )
      SELECT STATIONCODE, COSTCENTER,
             TOTAL_TERMINATIONS, TOTAL_HEADCOUNT, DAYS_IN_PERIOD,
             ROUND((TOTAL_TERMINATIONS / NULLIF(TOTAL_HEADCOUNT, 0)) * (365.0 / DAYS_IN_PERIOD) * 100, 2) AS ATTRITION_RATE_PCT
      FROM period_data
      ORDER BY ATTRITION_RATE_PCT DESC NULLS LAST
    views: [AGGEMPCOUNT_ATTRITION_DATA_V]
    steps:
      - order: 1
        name: "period_data_cte"
        logic: "CTE 'period_data': GROUP BY STATIONCODE, COSTCENTER. SUM(TOTAL_TERMINATION) as TOTAL_TERMINATIONS. SUM(EMPLOYEE_HEADCOUNT_ATTRITION) as TOTAL_HEADCOUNT. MIN/MAX(DATE) for PERIOD_START and PERIOD_END. DATEDIFF for DAYS_IN_PERIOD."
        required_columns: [DATE, STATIONCODE, COSTCENTER, TOTAL_TERMINATION, EMPLOYEE_HEADCOUNT_ATTRITION]
      - order: 2
        name: "apply_date_filter"
        logic: "Apply DATE filter in WHERE clause of the CTE. Use the detected period SQL expression directly (e.g. DATE >= DATE_TRUNC('year', CURRENT_DATE)). If no period given, do not add a WHERE clause."
        required_columns: [DATE]
      - order: 3
        name: "apply_dimension_filters"
        logic: "Optionally add STATIONCODE = '{value}' and/or COSTCENTER = '{value}' to the CTE WHERE clause if those terms were detected."
        required_columns: [STATIONCODE, COSTCENTER]
      - order: 4
        name: "compute_annualized_rate"
        logic: "Final SELECT from period_data CTE: ROUND((TOTAL_TERMINATIONS / NULLIF(TOTAL_HEADCOUNT, 0)) * (365.0 / DAYS_IN_PERIOD) * 100, 2) AS ATTRITION_RATE_PCT. Order by ATTRITION_RATE_PCT DESC NULLS LAST."
        required_columns: [TOTAL_TERMINATIONS, TOTAL_HEADCOUNT, DAYS_IN_PERIOD]
    filters:
      - { column: DATE, source: detected_period, operator: ">=" }
      - { column: STATIONCODE, source: detected_station, operator: "=" }
      - { column: COSTCENTER, source: detected_costcenter, operator: "=" }
    output_shape:
      type: aggregate
      columns: [STATIONCODE, COSTCENTER, TOTAL_TERMINATIONS, TOTAL_HEADCOUNT, DAYS_IN_PERIOD, ATTRITION_RATE_PCT]
      order_by: [ATTRITION_RATE_PCT DESC NULLS LAST]
    synonyms:
      - "detailed attrition"
      - "attrition breakdown"
      - "attrition by cost center"
      - "turnover breakdown"
      - "attrition detail"
      - "attrition rate breakdown"
      - "show attrition by cost center"
    version: "1.0"
    status: active
    owner: data_team
    valid_from: "2026-05-28"
