# Golden tests for Attrition KPI domain
# Each test validates: detected KPI, SQL contains expected fragments, validation passes

golden_tests:
  - id: attrition_rate_station_ytd
    question: "What is the attrition rate at MSP YTD?"
    expected_kpi: "Attrition Rate"
    expected_kpi_id: "kpi_attrition_rate_simple"
    expected_sql_contains:
      - "AGGEMPCOUNT_ATTRITION_DATA_V"
      - "TOTAL_TERMINATION"
      - "EMPLOYEE_HEADCOUNT_ATTRITION"
      - "MSP"
      - "DATE_TRUNC"
    expected_validation: passed

  - id: attrition_rate_all_stations_this_month
    question: "Show me the attrition rate this month"
    expected_kpi: "Attrition Rate"
    expected_kpi_id: "kpi_attrition_rate_simple"
    expected_sql_contains:
      - "AGGEMPCOUNT_ATTRITION_DATA_V"
      - "TOTAL_TERMINATION"
      - "EMPLOYEE_HEADCOUNT_ATTRITION"
      - "DATE_TRUNC"
    expected_validation: passed

  - id: attrition_rate_last_90_days
    question: "What is the turnover rate for the last 90 days?"
    expected_kpi: "Attrition Rate"
    expected_kpi_id: "kpi_attrition_rate_simple"
    expected_sql_contains:
      - "AGGEMPCOUNT_ATTRITION_DATA_V"
      - "DATEADD"
      - "90"
    expected_validation: passed

  - id: attrition_detail_by_cost_center
    question: "Show attrition breakdown by cost center YTD"
    expected_kpi: "Attrition Rate Detail"
    expected_kpi_id: "kpi_attrition_rate_detail"
    expected_sql_contains:
      - "AGGEMPCOUNT_ATTRITION_DATA_V"
      - "STATIONCODE"
      - "COSTCENTER"
      - "ATTRITION_RATE_PCT"
    expected_validation: passed

  - id: attrition_detail_station_last_quarter
    question: "Detailed attrition breakdown for ATL last quarter"
    expected_kpi: "Attrition Rate Detail"
    expected_kpi_id: "kpi_attrition_rate_detail"
    expected_sql_contains:
      - "AGGEMPCOUNT_ATTRITION_DATA_V"
      - "ATL"
      - "DATEADD"
    expected_validation: passed

  - id: attrition_how_many_left
    question: "How many employees left this year?"
    expected_kpi: "Attrition Rate"
    expected_kpi_id: "kpi_attrition_rate_simple"
    expected_sql_contains:
      - "AGGEMPCOUNT_ATTRITION_DATA_V"
      - "TOTAL_TERMINATION"
    expected_validation: passed
