 rgba(255, 255, 255, 0.4);\n  --ilk-white-10:      rgba(255, 255, 255, 0.1);\n\n  /* ─── Semantic foreground/background ─── */\n  --bg:                var(--ilk-black);\n  --bg-panel:          var(--ilk-ink-1);\n  --bg-elevated:       var(--ilk-ink-2);\n  --bg-glass:          radial-gradient(rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 100%);\n\n  --fg:                var(--ilk-white);        /* primary text */\n  --fg-muted:          var(--ilk-gray-300);     /* eyebrow */\n  --fg-subtle:         var(--ilk-gray-500);     /* caption */\n  --fg-faint:          var(--ilk-gray-700);     /* tertiary */\n  --fg-on-light:       var(--ilk-black);\n  --fg-link:           var(--ilk-red);\n\n  --border:            var(--ilk-white-10);\n  --border-strong:     var(--ilk-gray-700);\n\n  --accent:            var(--ilk-red);\n  --accent-fg:         var(--ilk-white);\n\n  /* ─── Type ─── */\n  --font-sans:    \"Public Sans\", \"Helvetica Neue\", system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Arial, sans-serif;\n  --font-display: \"Public Sans\", \"Helvetica Neue\", sans-serif;\n  --font-utility: \"Helvetica Neue\", \"Public Sans\", sans-serif;   /* hex labels, captions */\n\n  --fw-light:    300;\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n  --fw-extra:    800;\n\n  /* Display scale — Public Sans Medium, large & quiet */\n  --fs-display-xl: 64px;   --lh-display-xl: 1.05;\n  --fs-display-l:  48px;   --lh-display-l:  1.05;\n  --fs-display-m:  40px;   --lh-display-m:  1.2;\n  --fs-h1:         36px;   --lh-h1:         1.22;\n  --fs-h2:         32px;   --lh-h2:         1.25;\n  --fs-h3:         28px;   --lh-h3:         1.28;\n  --fs-h4:         24px;   --lh-h4:         1.33;\n  --fs-h5:         20px;   --lh-h5:         1.3;\n  --fs-h6:         18px;   --lh-h6:         1.44;\n  --fs-body-l:     18px;   --lh-body-l:     1.55;\n  --fs-body:       16px;   --lh-body:       1.625;\n  --fs-body-s:     14px;   --lh-body-s:     1.57;\n  --fs-caption:    12px;   --lh-caption:    1.42;\n  --fs-eyebrow:    12px;   --lh-eyebrow:    1.42;\n\n  --ls-tight:    -0.011em;\n  --ls-eyebrow:  0.08em;\n\n  /* ─── Spacing (4-pt grid) ─── */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  24px;\n  --sp-6:  32px;\n  --sp-7:  40px;\n  --sp-8:  56px;\n  --sp-9:  64px;\n  --sp-10: 80px;\n  --sp-11: 104px;\n  --sp-12: 128px;\n\n  /* ─── Radii ─── */\n  --r-sm:  2px;    /* buttons — signature sharp corner */\n  --r-md:  4px;\n  --r-lg:  8px;    /* cards */\n  --r-xl:  16px;\n  --r-2xl: 24px;   /* hero / display tile */\n  --r-pill: 64px;\n\n  /* ─── Elevation ─── */\n  --shadow-none:  none;\n  --shadow-press: inset 0 1px 0 rgba(0,0,0,0.25);\n  /* Cards float flat against dark imagery — no drop shadows by default. */\n\n  /* ─── Motion ─── */\n  --ease:        cubic-bezier(0.2, 0.6, 0.2, 1);\n  --dur-fast:    150ms;\n  --dur-base:    200ms;\n  --dur-slow:    300ms;\n\n  /* ─── Layout constants ─── */\n  --container-max:    1280px;\n  --container-pad-x:  80px;\n  --container-pad-x-sm: 24px;\n}\n\n/* ─────────────────────────────────────────────────────────────────\n   Element defaults — apply tokens directly to native HTML.\n   ───────────────────────────────────────────────────────────────── */\nhtml {\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: var(--lh-body);\n  color: var(--fg);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg);\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 var(--sp-5) 0;\n  font-family: var(--font-display);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-display-l); line-height: var(--lh-display-l); }\nh2 { font-size: var(--fs-h1);        line-height: var(--lh-h1); }\nh3 { font-size: var(--fs-h3);        line-height: var(--lh-h3); }\nh4 { font-size: var(--fs-h4);        line-height: var(--lh-h4); }\nh5 { font-size: var(--fs-h5);        line-height: var(--lh-h5); font-weight: var(--fw-semibold); }\nh6 { font-size: var(--fs-h6);        line-height: var(--lh-h6); font-weight: var(--fw-semibold); }\n\np {\n  margin: 0 0 var(--sp-4) 0;\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--fg);\n  text-wrap: pretty;\n}\n\nsmall, .caption {\n  font-size: var(--fs-caption);\n  line-height: var(--lh-caption);\n  color: var(--fg-subtle);\n}\n\na {\n  color: var(--fg);\n  text-decoration: none;\n  border-bottom: 1px solid transparent;\n  transition: border-color var(--dur-base) var(--ease), color var(--dur-base) var(--ease);\n}\na:hover { border-bottom-color: var(--ilk-red); }\n\ncode, pre, kbd, samp {\n  font-family: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n  font-size: 0.92em;\n}\n\nhr {\n  border: 0;\n  border-top: 1px solid var(--border);\n  margin: var(--sp-7) 0;\n}\n\n::selection { background: var(--ilk-red); color: var(--ilk-white); }\n\n/* ─────────────────────────────────────────────────────────────────\n   Utility helpers used across the system.\n   ───────────────────────────────────────────────────────────────── */\n.eyebrow {\n  font-size: var(--fs-eyebrow);\n  line-height: var(--lh-eyebrow);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--fg-muted);\n  font-weight: var(--fw-regular);\n}\n\n.display-xl { font-size: var(--fs-display-xl); line-height: var(--lh-display-xl); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }\n.display-l  { font-size: var(--fs-display-l);  line-height: var(--lh-display-l);  font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }\n.display-m  { font-size: var(--fs-display-m);  line-height: var(--lh-display-m);  font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }\n.lead       { font-size: var(--fs-body-l);     line-height: var(--lh-body-l);     color: var(--fg); }\n\n.surface-glass {\n  background: radial-gradient(rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 100%);\n  backdrop-filter: blur(42px);\n  -webkit-backdrop-filter: blur(42px);\n}\n\n.surface-panel { background: var(--bg-panel); }\n.surface-elev  { background: var(--bg-elevated); }\n<\u002Fstyle>\n<style>/* ─────────────────────────────────────────────────────────────────\n   Unifi KPI Ontology — Architecture & Flow Document\n   iLink Digital · long-form technical document · LIGHT THEME\n   Tokens come from colors_and_type.css; remapped to light here.\n   ───────────────────────────────────────────────────────────────── */\n\n:root {\n  /* Light-theme remap of iLink tokens (mirrors the deck) */\n  --bg:            #FFFFFF;\n  --bg-soft:       #F7F8FA;\n  --fg:            #15171C;\n  --ilk-white:     #15171C;       /* \"white\" text → near-black */\n  --ilk-gray-300:  #41454D;       /* body copy */\n  --ilk-gray-500:  #6A6F78;       /* muted */\n  --ilk-gray-700:  #9BA0A9;       /* faint / footer */\n  --ilk-ink-1:     #F4F6F8;       /* panel surface */\n  --ilk-ink-2:     #E8EBEF;       /* elevated surface */\n  --ilk-white-10:  rgba(21,23,28,0.12);   /* hairline borders */\n\n  --hair:          rgba(21,23,28,0.10);\n  --hair-soft:     rgba(21,23,28,0.06);\n  --panel-shadow:  0 1px 2px rgba(21,23,28,0.04), 0 10px 30px rgba(21,23,28,0.06);\n\n  --sidebar-w:     308px;\n  --content-max:   1120px;\n  --mono: \"SF Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, \"Liberation Mono\", monospace;\n}\n\n* { box-sizing: border-box; }\n\nhtml { font-size: 16px; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-sans);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ── Top bar ──────────────────────────────────────────────────── */\n.topbar {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 64px;\n  padding: 0 36px;\n  background: rgba(255,255,255,0.82);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  border-bottom: 1px solid var(--hair);\n}\n.topbar .brand { display: flex; align-items: center; gap: 20px; }\n.topbar .brand img { height: 26px; display: block; }\n.topbar .brand .divider { width: 1px; height: 26px; background: var(--hair); }\n.topbar .brand .doc-name {\n  font-size: 13px;\n  letter-spacing: 0.06em;\n  color: var(--ilk-gray-500);\n  font-weight: 500;\n}\n.topbar .meta {\n  display: flex;\n  align-items: center;\n  gap: 18px;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ilk-gray-700);\n  font-weight: 600;\n}\n.topbar .meta .conf {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  color: var(--ilk-red);\n}\n.topbar .meta .conf::before {\n  content: \"\";\n  width: 6px; height: 6px; border-radius: 1px;\n  background: var(--ilk-red);\n}\n\n/* ── Layout shell ─────────────────────────────────────────────── */\n.shell {\n  display: grid;\n  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);\n  align-items: start;\n}\n\n/* ── Sidebar nav ──────────────────────────────────────────────── */\n.sidebar {\n  position: sticky;\n  top: 64px;\n  height: calc(100vh - 64px);\n  overflow-y: auto;\n  border-right: 1px solid var(--hair);\n  padding: 40px 28px 64px 36px;\n  background: var(--bg);\n}\n.sidebar .toc-label {\n  font-size: 11px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--ilk-gray-700);\n  font-weight: 700;\n  margin-bottom: 22px;\n}\n.sidebar nav { display: flex; flex-direction: column; gap: 2px; }\n.sidebar nav a {\n  display: flex;\n  gap: 12px;\n  padding: 8px 12px 8px 14px;\n  border: 0;\n  border-left: 2px solid transparent;\n  border-radius: 0 4px 4px 0;\n  font-size: 14.5px;\n  line-height: 1.35;\n  color: var(--ilk-gray-500);\n  font-weight: 500;\n  text-decoration: none;\n  transition: color .15s ease, background .15s ease, border-color .15s ease;\n}\n.sidebar nav a .n {\n  color: var(--ilk-gray-700);\n  font-variant-numeric: tabular-nums;\n  font-weight: 600;\n  flex: 0 0 auto;\n  min-width: 14px;\n}\n.sidebar nav a:hover { color: var(--fg); background: var(--bg-soft); }\n.sidebar nav a.active {\n  color: var(--ilk-red);\n  border-left-color: var(--ilk-red);\n  background: rgba(248,0,0,0.045);\n}\n.sidebar nav a.active .n { color: var(--ilk-red); }\n.sidebar nav a.sub {\n  padding-left: 36px;\n  font-size: 13.5px;\n  font-weight: 400;\n}\n.sidebar .toc-foot {\n  margin-top: 32px;\n  padding-top: 22px;\n  border-top: 1px solid var(--hair);\n  font-size: 12px;\n  line-height: 1.7;\n  color: var(--ilk-gray-700);\n}\n.sidebar .toc-foot b { color: var(--ilk-gray-500); font-weight: 600; }\n\n/* ── Main column ──────────────────────────────────────────────── */\nmain {\n  min-width: 0;\n  padding: 0 64px 160px;\n}\n.wrap { max-width: var(--content-max); margin: 0 auto; }\n\n/* ── Cover ────────────────────────────────────────────────────── */\n.cover {\n  padding: 96px 0 72px;\n  border-bottom: 1px solid var(--hair);\n  margin-bottom: 16px;\n}\n.cover .kicker {\n  font-size: 13px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--ilk-gray-500);\n  font-weight: 600;\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  margin-bottom: 36px;\n}\n.cover .kicker::before {\n  content: \"\";\n  width: 36px; height: 2px; background: var(--ilk-red); display: inline-block;\n}\n.cover h1 {\n  font-size: 76px;\n  line-height: 1.02;\n  letter-spacing: -0.02em;\n  font-weight: 500;\n  margin: 0 0 28px;\n  max-width: 18ch;\n  text-wrap: balance;\n}\n.cover h1 .red { color: var(--ilk-red); }\n.cover .lede {\n  font-size: 23px;\n  line-height: 1.5;\n  font-weight: 300;\n  color: var(--ilk-gray-300);\n  max-width: 70ch;\n  margin: 0 0 56px;\n  text-wrap: pretty;\n}\n.cover .facts {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0,1fr));\n  gap: 1px;\n  background: var(--hair);\n  border: 1px solid var(--hair);\n  border-radius: 8px;\n  overflow: hidden;\n}\n.cover .facts .f { background: var(--bg); padding: 22px 24px; }\n.cover .facts .f .k {\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ilk-gray-500);\n  font-weight: 600;\n  margin-bottom: 8px;\n}\n.cover .facts .f .v {\n  font-size: 18px;\n  font-weight: 600;\n  color: var(--fg);\n}\n.cover .facts .f .v.red { color: var(--ilk-red); }\n\n/* ── Sections & headings ──────────────────────────────────────── */\nsection.doc { padding-top: 72px; scroll-margin-top: 84px; }\n.sec-eyebrow {\n  font-size: 12px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--ilk-red);\n  font-weight: 700;\n  margin-bottom: 14px;\n}\nh2.h {\n  font-size: 42px;\n  line-height: 1.1;\n  letter-spacing: -0.015em;\n  font-weight: 500;\n  margin: 0 0 24px;\n  display: flex;\n  align-items: baseline;\n  gap: 20px;\n}\nh2.h .secnum {\n  font-size: 22px;\n  font-weight: 600;\n  color: var(--ilk-gray-700);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0;\n}\nh3.h {\n  font-size: 25px;\n  line-height: 1.25;\n  letter-spacing: -0.01em;\n  font-weight: 600;\n  margin: 56px 0 18px;\n  padding-top: 8px;\n  scroll-margin-top: 84px;\n}\nh3.h .tag {\n  font-family: var(--mono);\n  font-size: 14px;\n  font-weight: 500;\n  color: var(--ilk-gray-500);\n  margin-left: 12px;\n  letter-spacing: 0;\n}\nh4.h {\n  font-size: 14px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  font-weight: 700;\n  color: var(--ilk-gray-500);\n  margin: 40px 0 16px;\n}\n\np.body {\n  font-size: 18px;\n  line-height: 1.65;\n  color: var(--ilk-gray-300);\n  margin: 0 0 20px;\n  max-width: 78ch;\n  text-wrap: pretty;\n}\np.body strong { color: var(--fg); font-weight: 600; }\np.body code, li code, td code, .tbl code { font-family: var(--mono); }\ncode.inl {\n  font-family: var(--mono);\n  font-size: 0.86em;\n  background: var(--ilk-ink-1);\n  border: 1px solid var(--hair-soft);\n  border-radius: 4px;\n  padding: 1px 6px;\n  color: #B4231A;\n  white-space: nowrap;\n}\n\n/* ── Lists ────────────────────────────────────────────────────── */\nul.clean { list-style: none; margin: 8px 0 24px; padding: 0; display: flex; flex-direction: column; gap: 14px; max-width: 84ch; }\nul.clean li {\n  font-size: 17.5px;\n  line-height: 1.55;\n  color: var(--ilk-gray-300);\n  padding-left: 28px;\n  position: relative;\n}\nul.clean li::before {\n  content: \"\";\n  position: absolute;\n  left: 0; top: 12px;\n  width: 14px; height: 2px;\n  background: var(--ilk-red);\n}\nul.clean li strong { color: var(--fg); font-weight: 600; }\n\n/* ── Callout ──────────────────────────────────────────────────── */\n.callout {\n  margin: 28px 0;\n  padding: 26px 30px;\n  border-left: 3px solid var(--ilk-red);\n  background: rgba(248,0,0,0.045);\n  border-radius: 0 8px 8px 0;\n  max-width: 88ch;\n}\n.callout .label {\n  display: block;\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ilk-red);\n  font-weight: 700;\n  margin-bottom: 10px;\n}\n.callout p { margin: 0; font-size: 18px; line-height: 1.55; color: var(--fg); }\n.callout.green { border-left-color: #14823c; background: rgba(20,130,60,0.06); }\n.callout.green .label { color: #14823c; }\n\n/* ── Code block ───────────────────────────────────────────────── */\n.code {\n  margin: 22px 0 28px;\n  background: #14161B;\n  border: 1px solid #23262E;\n  border-radius: 8px;\n  overflow: hidden;\n  max-width: 88ch;\n}\n.code .bar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 11px 18px;\n  border-bottom: 1px solid #23262E;\n  background: #181B21;\n}\n.code .bar .lbl {\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: #8C93A1;\n  font-weight: 600;\n}\n.code .bar .dot { width: 10px; height: 10px; border-radius: 50%; background: #2C313B; }\n.code pre {\n  margin: 0;\n  padding: 18px 22px;\n  overflow-x: auto;\n  font-family: var(--mono);\n  font-size: 14px;\n  line-height: 1.7;\n  color: #D7DCE5;\n}\n.code pre .cmt { color: #6B7280; }\n.code pre .kw  { color: #FF7B72; }\n.code pre .str { color: #7EE787; }\n.code pre .fn  { color: #79C0FF; }\n.code pre .num { color: #F2CC60; }\n\n/* ── Tables ───────────────────────────────────────────────────── */\n.tablewrap {\n  margin: 22px 0 30px;\n  border: 1px solid var(--hair);\n  border-radius: 10px;\n  overflow: hidden;\n  box-shadow: var(--panel-shadow);\n}\ntable.tbl {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 15.5px;\n  color: var(--fg);\n  background: var(--bg);\n}\ntable.tbl thead th {\n  text-align: left;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ilk-gray-500);\n  font-weight: 700;\n  padding: 14px 22px;\n  background: var(--bg-soft);\n  border-bottom: 1px solid var(--hair);\n  vertical-align: middle;\n}\ntable.tbl tbody td {\n  padding: 16px 22px;\n  border-bottom: 1px solid var(--hair-soft);\n  vertical-align: top;\n  line-height: 1.5;\n  color: var(--ilk-gray-300);\n}\ntable.tbl tbody tr:last-child td { border-bottom: none; }\ntable.tbl tbody tr.group td {\n  background: var(--bg-soft);\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 700;\n  color: var(--ilk-gray-500);\n  padding: 9px 22px;\n}\ntable.tbl .rl { font-weight: 600; color: var(--fg); }\ntable.tbl .mono { font-family: var(--mono); font-size: 13.5px; color: #B4231A; }\ntable.tbl .mono.ink { color: var(--fg); }\ntable.tbl td.center, table.tbl th.center { text-align: center; }\ntable.tbl tbody tr:hover td { background: rgba(248,0,0,0.022); }\ntable.tbl tbody tr.group:hover td { background: var(--bg-soft); }\n.tbl .pill {\n  display: inline-block;\n  font-size: 10.5px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  padding: 3px 9px;\n  border-radius: 2px;\n  background: var(--ilk-red);\n  color: #fff;\n  font-weight: 700;\n  white-space: nowrap;\n}\n.tbl .pill.ok { background: #14823c; }\n.tbl .pill.muted { background: var(--ilk-ink-2); color: var(--ilk-gray-300); }\n.tbl .pill.blue { background: var(--ilk-blue); }\n.tbl .stepn {\n  display: inline-flex;\n  align-items: center; justify-content: center;\n  width: 26px; height: 26px;\n  border-radius: 50%;\n  background: var(--ilk-red);\n  color: #fff;\n  font-size: 13px;\n  font-weight: 700;\n  font-variant-numeric: tabular-nums;\n}\n\n/* ── Diagrams ─────────────────────────────────────────────────── */\n.figure {\n  margin: 32px 0 12px;\n  border: 1px solid var(--hair);\n  border-radius: 12px;\n  background:\n    linear-gradient(var(--bg-soft), var(--bg-soft)) padding-box;\n  padding: 44px 40px 40px;\n  box-shadow: var(--panel-shadow);\n  position: relative;\n  overflow: hidden;\n}\n.figure::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  background-image:\n    radial-gradient(circle at 1px 1px, rgba(21,23,28,0.05) 1px, transparent 0);\n  background-size: 22px 22px;\n  pointer-events: none;\n}\n.figcap {\n  font-size: 13px;\n  color: var(--ilk-gray-500);\n  margin: 0 0 30px;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n.figcap .fn {\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ilk-red);\n  font-weight: 700;\n}\n.figcap .fn::after { content: \"\"; display: inline-block; width: 18px; height: 1px; background: var(--hair); margin-left: 12px; vertical-align: middle; }\n.fig-inner { position: relative; }\n\n/* node card used across diagrams */\n.node {\n  background: var(--bg);\n  border: 1px solid var(--hair);\n  border-radius: 10px;\n  padding: 18px 20px;\n  box-shadow: 0 1px 2px rgba(21,23,28,0.04), 0 6px 18px rgba(21,23,28,0.05);\n}\n.node .nt {\n  font-size: 16px;\n  font-weight: 700;\n  color: var(--fg);\n  margin: 0 0 4px;\n  letter-spacing: -0.005em;\n}\n.node .ns { font-size: 12.5px; color: var(--ilk-gray-500); line-height: 1.4; }\n.node .role {\n  font-size: 10.5px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ilk-gray-700);\n  font-weight: 700;\n  margin-bottom: 8px;\n}\n.node.red { border-color: rgba(248,0,0,0.45); background: linear-gradient(180deg, rgba(248,0,0,0.05), rgba(248,0,0,0.015)); }\n.node.red .role { color: var(--ilk-red); }\n.node.blue { border-color: rgba(22,113,187,0.4); background: linear-gradient(180deg, rgba(22,113,187,0.06), rgba(22,113,187,0.02)); }\n.node.blue .role { color: var(--ilk-blue); }\n\n/* generic diagram grid + connector */\n.dgrid { display: grid; align-items: center; gap: 0; }\n.dgrid > * { min-width: 0; }\n.node .nt { overflow-wrap: anywhere; }\n.conn {\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  gap: 5px; padding: 0 14px; color: var(--ilk-red);\n}\n.conn svg { width: 44px; height: 16px; }\n.conn .lab {\n  font-family: var(--mono); font-size: 11px; line-height: 1.3;\n  color: var(--ilk-gray-500); letter-spacing: 0;\n}\n\n/* System architecture flow */\n.arch-flow {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 0 14px;\n  align-items: stretch;\n  position: relative;\n}\n.arch-col { display: flex; flex-direction: column; gap: 14px; }\n.arch-arrow {\n  align-self: center;\n  color: var(--ilk-red);\n  display: flex; align-items: center; justify-content: center;\n}\n.arch-arrow svg { width: 30px; height: 18px; }\n.lane {\n  margin-top: 26px;\n  display: flex; align-items: center; gap: 16px;\n  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;\n  color: var(--ilk-gray-500); font-weight: 600;\n}\n.lane .ln { flex: 1; height: 1px; background: var(--hair); }\n\n/* Pipeline (vertical) */\n.pipe { display: flex; flex-direction: column; gap: 0; position: relative; }\n.pipe .pstep {\n  display: grid;\n  grid-template-columns: 64px 1fr;\n  gap: 24px;\n  position: relative;\n  padding-bottom: 30px;\n}\n.pipe .pstep:last-child { padding-bottom: 0; }\n.pipe .pstep .rail {\n  display: flex; flex-direction: column; align-items: center;\n}\n.pipe .pstep .pn {\n  width: 48px; height: 48px;\n  border-radius: 50%;\n  background: var(--ilk-red);\n  color: #fff;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 19px; font-weight: 700;\n  z-index: 2;\n  box-shadow: 0 4px 12px rgba(248,0,0,0.25);\n  flex: 0 0 auto;\n}\n.pipe .pstep .line {\n  width: 2px; flex: 1; background: var(--hair);\n  margin-top: 4px;\n}\n.pipe .pstep:last-child .line { display: none; }\n.pipe .pstep .pbody {\n  background: var(--bg);\n  border: 1px solid var(--hair);\n  border-radius: 10px;\n  padding: 20px 24px;\n  box-shadow: 0 1px 2px rgba(21,23,28,0.04), 0 6px 16px rgba(21,23,28,0.04);\n  margin-top: -2px;\n}\n.pipe .pstep .phead {\n  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\n  margin-bottom: 8px;\n}\n.pipe .pstep .phead .pt { font-size: 19px; font-weight: 700; color: var(--fg); margin: 0; letter-spacing: -0.01em; }\n.pipe .pstep .phead .src {\n  font-family: var(--mono); font-size: 12.5px; color: var(--ilk-gray-500);\n  background: var(--ilk-ink-1); border: 1px solid var(--hair-soft);\n  padding: 2px 8px; border-radius: 4px;\n}\n.pipe .pstep .phead .nollm {\n  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\n  color: #14823c; background: rgba(20,130,60,0.1); border: 1px solid rgba(20,130,60,0.3);\n  padding: 2px 8px; border-radius: 2px;\n}\n.pipe .pstep .phead .llm {\n  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\n  color: var(--ilk-red); background: rgba(248,0,0,0.08); border: 1px solid rgba(248,0,0,0.3);\n  padding: 2px 8px; border-radius: 2px;\n}\n.pipe .pstep .pbody p { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--ilk-gray-300); }\n\n/* Graph schema legend pills */\n.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 28px; }\n.legend .lg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ilk-gray-500); }\n.legend .lg .sw { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; }\n\n/* connector svg overlay */\n.connect-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }\n.connect-svg path { fill: none; stroke: var(--ilk-gray-700); stroke-width: 1.5; }\n.connect-svg path.red { stroke: var(--ilk-red); stroke-width: 1.75; }\n.connect-svg text {\n  font-family: var(--mono); font-size: 11px; fill: var(--ilk-gray-500);\n}\n\n/* Footer */\n.docfoot {\n  margin-top: 100px;\n  padding-top: 32px;\n  border-top: 1px solid var(--hair);\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 12px;\n  letter-spacing: 0.06em;\n  color: var(--ilk-gray-700);\n}\n.docfoot .dot { display: inline-block; width: 6px; height: 6px; background: var(--ilk-red); margin-right: 10px; vertical-align: middle; }\n\n/* Download button */\n.dlbtn {\n  display: inline-flex; align-items: center; gap: 10px;\n  background: var(--ilk-red); color: #fff;\n  font-size: 13px; font-weight: 600; letter-spacing: 0.02em;\n  padding: 11px 18px; border-radius: 2px;\n  text-decoration: none; border: 0; cursor: pointer;\n  transition: transform .12s ease, filter .15s ease;\n}\n.dlbtn:hover { filter: brightness(1.08); }\n.dlbtn:active { transform: translateY(1px); }\n.dlbtn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; }\n\n/* responsive */\n@media (max-width: 1100px) {\n  .shell { grid-template-columns: 1fr; }\n  .sidebar { display: none; }\n  main { padding: 0 32px 120px; }\n  .cover h1 { font-size: 52px; }\n  .arch-flow { grid-template-columns: 1fr; }\n  .arch-arrow { transform: rotate(90deg); margin: 4px 0; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ───────────── TOP BAR ───────────── -->\n<header class=\"topbar\">\n  <div class=\"brand\">\n    <img src=\"a7d383bd-1785-48c6-aac8-34813056a7ee\" alt=\"iLink Digital\">\n    <span class=\"divider\"><\u002Fspan>\n    <span class=\"doc-name\">Architecture &amp; Flow Document<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"meta\">\n    <span>v1.0<\u002Fspan>\n    <span>Updated May 31, 2026<\u002Fspan>\n    <span class=\"conf\">Confidential<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"shell\">\n\n  <!-- ───────────── SIDEBAR TOC ───────────── -->\n  <aside class=\"sidebar\">\n    <div class=\"toc-label\">Contents<\u002Fdiv>\n    <nav id=\"toc\">\n      <a href=\"#overview\" data-target=\"overview\"><span class=\"n\">1<\u002Fspan><span>Overview<\u002Fspan><\u002Fa>\n      <a href=\"#design-goals\" class=\"sub\" data-target=\"design-goals\"><span>Design Goals<\u002Fspan><\u002Fa>\n      <a href=\"#architecture\" data-target=\"architecture\"><span class=\"n\">2<\u002Fspan><span>System Architecture<\u002Fspan><\u002Fa>\n      <a href=\"#components\" class=\"sub\" data-target=\"components\"><span>Component Overview<\u002Fspan><\u002Fa>\n      <a href=\"#dataflow\" class=\"sub\" data-target=\"dataflow\"><span>Data Flow Summary<\u002Fspan><\u002Fa>\n      <a href=\"#seeding\" data-target=\"seeding\"><span class=\"n\">3<\u002Fspan><span>Phase 0 · Ontology Seeding<\u002Fspan><\u002Fa>\n      <a href=\"#yaml\" class=\"sub\" data-target=\"yaml\"><span>YAML File Inventory<\u002Fspan><\u002Fa>\n      <a href=\"#sequence\" class=\"sub\" data-target=\"sequence\"><span>Seeding Sequence<\u002Fspan><\u002Fa>\n      <a href=\"#graph\" class=\"sub\" data-target=\"graph\"><span>Neo4j Graph Schema<\u002Fspan><\u002Fa>\n      <a href=\"#pipeline\" data-target=\"pipeline\"><span class=\"n\">4<\u002Fspan><span>Runtime Pipeline<\u002Fspan><\u002Fa>\n      <a href=\"#flow\" class=\"sub\" data-target=\"flow\"><span>End-to-End Flow<\u002Fspan><\u002Fa>\n      <a href=\"#steps\" class=\"sub\" data-target=\"steps\"><span>Step Details<\u002Fspan><\u002Fa>\n      <a href=\"#views\" data-target=\"views\"><span class=\"n\">5<\u002Fspan><span>Snowflake Views<\u002Fspan><\u002Fa>\n      <a href=\"#joins\" class=\"sub\" data-target=\"joins\"><span>Join Paths<\u002Fspan><\u002Fa>\n      <a href=\"#decisions\" data-target=\"decisions\"><span class=\"n\">6<\u002Fspan><span>Key Design Decisions<\u002Fspan><\u002Fa>\n      <a href=\"#add-kpi\" data-target=\"add-kpi\"><span class=\"n\">7<\u002Fspan><span>Adding a New KPI<\u002Fspan><\u002Fa>\n    <\u002Fnav>\n    <div class=\"toc-foot\">\n      <b>Unifi KPI Ontology-Enabled Chatbot<\u002Fb><br>\n      Natural language → Snowflake SQL,<br>guided by a Neo4j knowledge graph.\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ───────────── MAIN ───────────── -->\n  <main>\n    <div class=\"wrap\">\n\n      <!-- COVER -->\n      <div class=\"cover\">\n        <div class=\"kicker\">Architecture &amp; Flow Document · Version 1.0<\u002Fdiv>\n        <h1>Unifi KPI Ontology<br>using <span class=\"red\">Neo4j<\u002Fspan><\u002Fh1>\n        <p class=\"lede\">An ontology-driven chatbot that converts natural-language questions into deterministic Snowflake SQL. A Neo4j knowledge graph constrains and guides generation — so the LLM assembles SQL from pre-validated components rather than interpreting raw input.<\u002Fp>\n        <div class=\"facts\">\n          <div class=\"f\"><div class=\"k\">Prepared by<\u002Fdiv><div class=\"v\">iLink Digital<\u002Fdiv><\u002Fdiv>\n          <div class=\"f\"><div class=\"k\">Audience<\u002Fdiv><div class=\"v\">Engineering<\u002Fdiv><\u002Fdiv>\n          <div class=\"f\"><div class=\"k\">Classification<\u002Fdiv><div class=\"v red\">Confidential<\u002Fdiv><\u002Fdiv>\n          <div class=\"f\"><div class=\"k\">Last updated<\u002Fdiv><div class=\"v\">May 31, 2026<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ═══════════ 1 · OVERVIEW ═══════════ -->\n      <section class=\"doc\" id=\"overview\">\n        <div class=\"sec-eyebrow\">Section 1<\u002Fdiv>\n        <h2 class=\"h\"><span class=\"secnum\">01<\u002Fspan>Overview<\u002Fh2>\n        <p class=\"body\">The Unifi KPI Chatbot converts natural-language questions into Snowflake SQL queries using an ontology-driven pipeline. Instead of relying on the LLM to interpret raw user input, the system uses a structured knowledge graph (<strong>Neo4j<\u002Fstrong>) to constrain and guide SQL generation.<\u002Fp>\n\n        <div class=\"callout\">\n          <span class=\"label\">Core Design Principle<\u002Fspan>\n          <p>The LLM never sees the raw user question. It receives a pre-structured context with exact column names, pre-built filters, and step-by-step logic — acting as a <strong>SQL assembler, not an interpreter<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"design-goals\">1.1 &nbsp;Design Goals<\u002Fh3>\n        <ul class=\"clean\">\n          <li><strong>Deterministic SQL generation<\u002Fstrong> — eliminate hallucinated column names and table references.<\u002Fli>\n          <li><strong>Ontology-driven intent resolution<\u002Fstrong> — all KPI, term, and entity mappings managed in YAML.<\u002Fli>\n          <li><strong>Row-level security<\u002Fstrong> enforced at validation time, not by the LLM.<\u002Fli>\n          <li><strong>Zero Python code changes<\u002Fstrong> required to add a new KPI.<\u002Fli>\n          <li><strong>Full audit trail<\u002Fstrong> — question, extracted intent, generated SQL, and latency returned in every response.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <!-- ═══════════ 2 · SYSTEM ARCHITECTURE ═══════════ -->\n      <section class=\"doc\" id=\"architecture\">\n        <div class=\"sec-eyebrow\">Section 2<\u002Fdiv>\n        <h2 class=\"h\"><span class=\"secnum\">02<\u002Fspan>System Architecture<\u002Fh2>\n        <p class=\"body\">The system comprises five integrated components. YAML files act as the single source of truth, Neo4j holds the runtime graph, FastAPI orchestrates the pipeline, Azure OpenAI generates SQL, and Snowflake executes it.<\u002Fp>\n\n        <!-- ARCHITECTURE DIAGRAM -->\n        <div class=\"figure\">\n          <div class=\"figcap\"><span class=\"fn\">Figure 2.1<\u002Fspan> Component topology &amp; data flow<\u002Fdiv>\n          <div class=\"fig-inner\">\n\n            <!-- Startup lane -->\n            <div class=\"role\" style=\"margin-bottom:12px;\">Startup · one-time seed<\u002Fdiv>\n            <div class=\"dgrid\" style=\"grid-template-columns:1fr auto 1fr; max-width:600px;\">\n              <div class=\"node\">\n                <div class=\"role\">Source of Truth<\u002Fdiv>\n                <p class=\"nt\">YAML Files<\u002Fp>\n                <div class=\"ns\">Ontology: views, joins, terms, KPIs, roles<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"conn\"><span class=\"lab\">seed<\u002Fspan><svg viewBox=\"0 0 30 18\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div class=\"node\">\n                <div class=\"role\">Graph Database<\u002Fdiv>\n                <p class=\"nt\">Neo4j<\u002Fp>\n                <div class=\"ns\">Ontology as nodes &amp; relationships<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"lane\"><span class=\"ln\"><\u002Fspan><span>Per request · runtime data flow<\u002Fspan><span class=\"ln\"><\u002Fspan><\u002Fdiv>\n\n            <!-- Runtime lane: 4 nodes -->\n            <div class=\"dgrid\" style=\"grid-template-columns:1fr auto 1.15fr auto 1fr auto 1fr; margin-top:18px;\">\n              <div class=\"node\">\n                <div class=\"role\">User Interface<\u002Fdiv>\n                <p class=\"nt\">Browser Client<\u002Fp>\n                <div class=\"ns\">Sends <code style=\"font-family:var(--mono);\">{question, user_id}<\u002Fcode><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"conn\"><span class=\"lab\">ask<\u002Fspan><svg viewBox=\"0 0 30 18\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div class=\"node red\">\n                <div class=\"role\">Orchestrator<\u002Fdiv>\n                <p class=\"nt\">FastAPI App<\u002Fp>\n                <div class=\"ns\">Runs the 7-step pipeline on <code style=\"font-family:var(--mono);\">POST /api/ask<\u002Fcode><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"conn\"><span class=\"lab\">context<\u002Fspan><svg viewBox=\"0 0 30 18\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div class=\"node blue\">\n                <div class=\"role\">SQL Assembler · LLM<\u002Fdiv>\n                <p class=\"nt\">Azure OpenAI<\u002Fp>\n                <div class=\"ns\">StructuredContext only · <code style=\"font-family:var(--mono);\">temp = 0<\u002Fcode><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"conn\"><span class=\"lab\">SQL<\u002Fspan><svg viewBox=\"0 0 30 18\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div class=\"node\">\n                <div class=\"role\">Data Warehouse<\u002Fdiv>\n                <p class=\"nt\">Snowflake<\u002Fp>\n                <div class=\"ns\">Validated SQL · 4 views · 10s timeout<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"ns\" style=\"margin-top:18px; max-width:78ch;\">During <strong style=\"color:var(--fg);\">Step 2<\u002Fstrong>, FastAPI queries <strong style=\"color:var(--fg);\">Neo4j<\u002Fstrong> for the KPI recipe; rows from Snowflake are wrapped into a <code style=\"font-family:var(--mono);\">PipelineResponse<\u002Fcode> and returned to the Browser Client.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"components\">2.1 &nbsp;Component Overview<\u002Fh3>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th style=\"width:18%;\">Component<\u002Fth><th style=\"width:20%;\">Role<\u002Fth><th>Key Responsibility<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td class=\"rl\">YAML Files<\u002Ftd><td>Source of Truth<\u002Ftd><td>Defines ontology: views, joins, terms, KPIs, roles, disambiguation rules.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Neo4j<\u002Ftd><td>Graph Database<\u002Ftd><td>Stores ontology as nodes &amp; relationships. Queried at runtime for KPI recipes and at startup for term dictionaries.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">FastAPI App<\u002Ftd><td>Orchestrator<\u002Ftd><td>Runs the 7-step pipeline on <code class=\"inl\">POST /api/ask<\u002Fcode>. Coordinates all components sequentially.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Azure OpenAI<\u002Ftd><td>SQL Assembler (LLM)<\u002Ftd><td>Receives <code class=\"inl\">StructuredContext<\u002Fcode> only — never raw user input. <code class=\"inl\">Temperature=0<\u002Fcode> for deterministic SQL output.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Snowflake<\u002Ftd><td>Data Warehouse<\u002Ftd><td>Executes validated SQL. 4 pre-defined views; connection pooling; 10s query timeout.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Browser Client<\u002Ftd><td>User Interface<\u002Ftd><td>Sends <code class=\"inl\">POST /api/ask {question, user_id}<\u002Fcode>. Receives <code class=\"inl\">PipelineResponse<\u002Fcode> with SQL, data, and latency metrics.<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"dataflow\">2.2 &nbsp;Data Flow Summary<\u002Fh3>\n        <p class=\"body\">At startup, YAML files are seeded into Neo4j. At query time, the FastAPI pipeline resolves intent from the question, retrieves the KPI recipe from Neo4j, builds a structured context, sends it to Azure OpenAI for SQL generation, validates the SQL, and executes it against Snowflake.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- ═══════════ 3 · ONTOLOGY SEEDING ═══════════ -->\n      <section class=\"doc\" id=\"seeding\">\n        <div class=\"sec-eyebrow\">Section 3 · Phase 0<\u002Fdiv>\n        <h2 class=\"h\"><span class=\"secnum\">03<\u002Fspan>Ontology Seeding<\u002Fh2>\n        <p class=\"body\">The seed process reads all YAML ontology files and loads them into Neo4j as a graph structure. It must be re-run whenever YAML files change. The operation is fully idempotent — it clears and reloads the entire graph, completing in approximately <strong>10 seconds<\u002Fstrong>.<\u002Fp>\n\n        <div class=\"code\">\n          <div class=\"bar\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">Command<\u002Fspan><\u002Fdiv>\n          <pre><span class=\"kw\">python<\u002Fspan> -m scripts.seed_ontology<\u002Fpre>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"yaml\">3.1 &nbsp;YAML File Inventory<\u002Fh3>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th style=\"width:28%;\">YAML File<\u002Fth><th style=\"width:34%;\">Content<\u002Fth><th>Example<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td class=\"mono\">ontology/schema/views.yaml<\u002Ftd><td>Snowflake view definitions (names, columns, types)<\u002Ftd><td><code class=\"inl\">DIMHISTORYEMPLOYEE_V<\u002Fcode> with 34 columns<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">ontology/schema/joins.yaml<\u002Ftd><td>Join conditions between views<\u002Ftd><td><code class=\"inl\">e.COSTCENTER = b.COSTCENTER<\u002Fcode><\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">ontology/schema/terms.yaml<\u002Ftd><td>Business terms, abbreviations, synonyms (~135 terms)<\u002Ftd><td>HC = Headcount, ATL = Atlanta, OT = Overtime<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">ontology/schema/disambiguation.yaml<\u002Ftd><td>Context-sensitive term resolution (~10 rules)<\u002Ftd><td>REG = Regular Employee vs Regular Hours<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">ontology/kpis/attrition.yaml<\u002Ftd><td>KPI recipe: formula, steps, filters, output shape for attrition domain<\u002Ftd><td>Attrition Rate, Turnover Rate<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">ontology/kpis/contract_hierarchy.yaml<\u002Ftd><td>KPI recipes for org hierarchy domain<\u002Ftd><td>List contracts, count contracts<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">ontology/security/roles.yaml<\u002Ftd><td>User access control at station / customer level<\u002Ftd><td>ATL manager sees ATL only<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"sequence\">3.2 &nbsp;Seeding Sequence<\u002Fh3>\n        <p class=\"body\">The seeder executes the following steps in order:<\u002Fp>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th style=\"width:12%;\">Step<\u002Fth><th style=\"width:34%;\">Operation<\u002Fth><th>Graph Action<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td><span class=\"stepn\">1<\u002Fspan><\u002Ftd><td class=\"mono ink\">_clear_ontology()<\u002Ftd><td><code class=\"inl\">MATCH (n) DETACH DELETE n<\u002Fcode> — full graph reset<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">2<\u002Fspan><\u002Ftd><td class=\"mono ink\">_load_views()<\u002Ftd><td>Creates 4 <code class=\"inl\">:View<\u002Fcode> nodes<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">3<\u002Fspan><\u002Ftd><td class=\"mono ink\">_load_joins()<\u002Ftd><td>Creates 3 <code class=\"inl\">:JOINS_TO<\u002Fcode> relationship paths<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">4<\u002Fspan><\u002Ftd><td class=\"mono ink\">_load_terms()<\u002Ftd><td>Creates ~135 <code class=\"inl\">:Term<\u002Fcode> nodes<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">5<\u002Fspan><\u002Ftd><td class=\"mono ink\">_load_disambiguation()<\u002Ftd><td>Creates ~10 <code class=\"inl\">:DisambiguationRule<\u002Fcode> nodes<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">6<\u002Fspan><\u002Ftd><td class=\"mono ink\">_load_kpis()<\u002Ftd><td>Creates <code class=\"inl\">:KPI<\u002Fcode>, <code class=\"inl\">:KPIStep<\u002Fcode>, <code class=\"inl\">:Filter<\u002Fcode> nodes for 7 KPIs<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">7<\u002Fspan><\u002Ftd><td class=\"mono ink\">_load_roles()<\u002Ftd><td>Creates 3 <code class=\"inl\">:User<\u002Fcode> nodes with authorized scopes<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">8<\u002Fspan><\u002Ftd><td class=\"mono ink\">validate_ontology()<\u002Ftd><td>Structural integrity checks on the complete graph<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"graph\">3.3 &nbsp;Neo4j Graph Schema<\u002Fh3>\n        <p class=\"body\">The ontology is stored as a property graph. The diagram below shows all node types and their relationships. The <strong>:KPI<\u002Fstrong> node is the anchor — the recipe lookup at query time traverses outward from it.<\u002Fp>\n\n        <!-- GRAPH SCHEMA DIAGRAM -->\n        <div class=\"figure\">\n          <div class=\"figcap\"><span class=\"fn\">Figure 3.1<\u002Fspan> Property-graph schema — node types &amp; relationships<\u002Fdiv>\n          <div class=\"fig-inner\">\n            <div style=\"display:grid; grid-template-columns: 220px 1fr; gap: 0 0; align-items:center;\">\n              <!-- anchor -->\n              <div class=\"node red\" style=\"text-align:center; padding: 26px 20px;\">\n                <div class=\"role\">Anchor<\u002Fdiv>\n                <p class=\"nt\" style=\"font-family:var(--mono); font-size:19px;\">:KPI<\u002Fp>\n                <div class=\"ns\">id · name · formula · complexity<\u002Fdiv>\n              <\u002Fdiv>\n              <!-- relationships fan -->\n              <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                <div style=\"display:grid; grid-template-columns: 230px 1fr; align-items:center; gap:0;\">\n                  <div style=\"display:flex; align-items:center; gap:10px; padding-left:10px;\">\n                    <svg viewBox=\"0 0 30 18\" style=\"width:46px;height:16px;color:var(--ilk-red);flex:0 0 auto;\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"font-family:var(--mono);font-size:12px;color:var(--ilk-red);\">[:USES_VIEW]<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"node\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:16px;\">:View<\u002Fp><div class=\"ns\">name · schema · columns · alias<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns: 230px 1fr; align-items:center; gap:0;\">\n                  <div style=\"display:flex; align-items:center; gap:10px; padding-left:10px;\">\n                    <svg viewBox=\"0 0 30 18\" style=\"width:46px;height:16px;color:var(--ilk-red);flex:0 0 auto;\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"font-family:var(--mono);font-size:12px;color:var(--ilk-red);\">[:REQUIRES_STEP]<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"node\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:16px;\">:KPIStep<\u002Fp><div class=\"ns\">order · logic · required_columns<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns: 230px 1fr; align-items:center; gap:0;\">\n                  <div style=\"display:flex; align-items:center; gap:10px; padding-left:10px;\">\n                    <svg viewBox=\"0 0 30 18\" style=\"width:46px;height:16px;color:var(--ilk-red);flex:0 0 auto;\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"font-family:var(--mono);font-size:12px;color:var(--ilk-red);\">[:HAS_FILTER]<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"node\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:16px;\">:Filter<\u002Fp><div class=\"ns\">column · source · operator<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- View self-join -->\n            <div style=\"display:flex; align-items:center; gap:18px; margin-top:26px; padding-top:24px; border-top:1px dashed var(--hair);\">\n              <div class=\"node\" style=\"flex:0 0 auto;\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:15px;\">:View<\u002Fp><div class=\"ns\">e.g. DIMHISTORYEMPLOYEE_V<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; align-items:center; gap:4px;\">\n                <span style=\"font-family:var(--mono);font-size:12px;color:var(--ilk-gray-500);\">[:JOINS_TO]<\u002Fspan>\n                <svg viewBox=\"0 0 30 18\" style=\"width:46px;height:16px;color:var(--ilk-gray-700);\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:11px;color:var(--ilk-gray-700);\">join condition + type<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"node\" style=\"flex:0 0 auto;\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:15px;\">:View<\u002Fp><div class=\"ns\">e.g. DIMFINANCEBUSINESSSTRUCTURE_V<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;\"><\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- standalone lookup nodes -->\n            <div style=\"margin-top:26px; padding-top:24px; border-top:1px dashed var(--hair);\">\n              <div class=\"role\" style=\"margin-bottom:14px;\">Lookup nodes · resolved independently at runtime / startup<\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns: repeat(3,1fr); gap:14px;\">\n                <div class=\"node blue\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:15px;\">:Term<\u002Fp><div class=\"ns\">code · canonical · category · column<\u002Fdiv><\u002Fdiv>\n                <div class=\"node blue\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:15px;\">:DisambiguationRule<\u002Fp><div class=\"ns\">term · context · resolves_to · column<\u002Fdiv><\u002Fdiv>\n                <div class=\"node blue\"><p class=\"nt\" style=\"font-family:var(--mono);font-size:15px;\">:User<\u002Fp><div class=\"ns\">user_id · email · authorized_stations<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"legend\">\n              <span class=\"lg\"><span class=\"sw\" style=\"border-color:rgba(248,0,0,0.5);background:rgba(248,0,0,0.06);\"><\u002Fspan>Anchor node<\u002Fspan>\n              <span class=\"lg\"><span class=\"sw\" style=\"border-color:var(--hair);background:var(--bg);\"><\u002Fspan>Recipe / schema node<\u002Fspan>\n              <span class=\"lg\"><span class=\"sw\" style=\"border-color:rgba(22,113,187,0.4);background:rgba(22,113,187,0.07);\"><\u002Fspan>Independent lookup node<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h4 class=\"h\">Node &amp; relationship reference<\u002Fh4>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th style=\"width:26%;\">Node / Relationship<\u002Fth><th style=\"width:30%;\">Properties / Direction<\u002Fth><th>Purpose<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr class=\"group\"><td colspan=\"3\">Nodes<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">:KPI<\u002Ftd><td>id, name, formula, complexity<\u002Ftd><td>Central recipe node; anchor of the ontology graph.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">:View<\u002Ftd><td>name, schema, columns, alias<\u002Ftd><td>Snowflake view definition; carries column metadata.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">:KPIStep<\u002Ftd><td>order, logic, required_columns<\u002Ftd><td>Ordered computation step within a KPI recipe.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">:Filter<\u002Ftd><td>column, source, operator<\u002Ftd><td>Pre-defined filter constraint used in WHERE clauses.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">:Term<\u002Ftd><td>code, canonical, category, column<\u002Ftd><td>Business term / synonym mapping (e.g. ATL → STATIONCODE).<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">:DisambiguationRule<\u002Ftd><td>term, context, resolves_to, column<\u002Ftd><td>Context-sensitive resolution (e.g. REG = Regular vs Regular Hours).<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">:User<\u002Ftd><td>user_id, email, authorized_stations<\u002Ftd><td>Role-based access control; determines RLS scope.<\u002Ftd><\u002Ftr>\n              <tr class=\"group\"><td colspan=\"3\">Relationships<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">[:USES_VIEW]<\u002Ftd><td>:KPI → :View<\u002Ftd><td>Links a KPI to its required Snowflake views.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">[:REQUIRES_STEP]<\u002Ftd><td>:KPI → :KPIStep<\u002Ftd><td>Ordered computation steps for the KPI formula.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">[:HAS_FILTER]<\u002Ftd><td>:KPI → :Filter<\u002Ftd><td>Default and mandatory filter constraints.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">[:JOINS_TO]<\u002Ftd><td>:View → :View<\u002Ftd><td>Join condition and type between two views.<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═══════════ 4 · RUNTIME PIPELINE ═══════════ -->\n      <section class=\"doc\" id=\"pipeline\">\n        <div class=\"sec-eyebrow\">Section 4<\u002Fdiv>\n        <h2 class=\"h\"><span class=\"secnum\">04<\u002Fspan>Runtime Pipeline<\u002Fh2>\n        <p class=\"body\">The pipeline orchestrator <code class=\"inl\">core/pipeline.py<\u002Fcode> calls each of the seven steps sequentially. Each step produces a typed output consumed by the next step. A failure at any step returns an error to the user; no subsequent steps execute.<\u002Fp>\n\n        <div class=\"code\">\n          <div class=\"bar\"><span class=\"dot\"><\u002Fspan><span class=\"lbl\">Entry point<\u002Fspan><\u002Fdiv>\n          <pre><span class=\"kw\">POST<\u002Fspan> /api/ask\n{ <span class=\"str\">\"question\"<\u002Fspan>: <span class=\"str\">\"...\"<\u002Fspan>, <span class=\"str\">\"user_id\"<\u002Fspan>: <span class=\"str\">\"...\"<\u002Fspan> }<\u002Fpre>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"flow\">4.1 &nbsp;End-to-End Pipeline Flow<\u002Fh3>\n\n        <!-- PIPELINE DIAGRAM -->\n        <div class=\"figure\">\n          <div class=\"figcap\"><span class=\"fn\">Figure 4.1<\u002Fspan> The seven-step request pipeline — each output feeds the next<\u002Fdiv>\n          <div class=\"fig-inner\">\n            <div class=\"pipe\">\n              <div class=\"pstep\">\n                <div class=\"rail\"><div class=\"pn\">1<\u002Fdiv><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n                <div class=\"pbody\">\n                  <div class=\"phead\"><p class=\"pt\">Intent Extraction<\u002Fp><span class=\"nollm\">No LLM<\u002Fspan><\u002Fdiv>\n                  <p>Parses NL question → detects KPI, entities (stations / customers / periods), aggregation modifiers. Dictionary-based; fuzzy matching via <code style=\"font-family:var(--mono);\">rapidfuzz<\u002Fcode>.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"pstep\">\n                <div class=\"rail\"><div class=\"pn\">2<\u002Fdiv><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n                <div class=\"pbody\">\n                  <div class=\"phead\"><p class=\"pt\">KPI Recipe Lookup<\u002Fp><span class=\"src\">Neo4j<\u002Fspan><\u002Fdiv>\n                  <p>Queries Neo4j by <code style=\"font-family:var(--mono);\">kpi_id<\u002Fcode> → retrieves formula, required views, ordered steps, and filter definitions for the matched KPI.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"pstep\">\n                <div class=\"rail\"><div class=\"pn\">3<\u002Fdiv><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n                <div class=\"pbody\">\n                  <div class=\"phead\"><p class=\"pt\">Context Building<\u002Fp><\u002Fdiv>\n                  <p>Merges extraction result + recipe. Resolves view names via <code style=\"font-family:var(--mono);\">views.yaml<\u002Fcode>, attaches column metadata, builds pre-validated SQL WHERE clauses.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"pstep\">\n                <div class=\"rail\"><div class=\"pn\">4<\u002Fdiv><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n                <div class=\"pbody\">\n                  <div class=\"phead\"><p class=\"pt\">LLM SQL Generation<\u002Fp><span class=\"llm\">Azure OpenAI<\u002Fspan><\u002Fdiv>\n                  <p>Sends StructuredContext to Azure OpenAI (<code style=\"font-family:var(--mono);\">temp = 0.0<\u002Fcode>). LLM acts as SQL assembler — not interpreter. Post-processes markdown fences and enforces canonical view names.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"pstep\">\n                <div class=\"rail\"><div class=\"pn\">5<\u002Fdiv><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n                <div class=\"pbody\">\n                  <div class=\"phead\"><p class=\"pt\">SQL Validation<\u002Fp><\u002Fdiv>\n                  <p>Checks for dangerous DML (DROP / DELETE / INSERT), validates all tables against the allowed-views list, enforces row-level security (<code style=\"font-family:var(--mono);\">STATIONCODE IN (...)<\u002Fcode>).<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"pstep\">\n                <div class=\"rail\"><div class=\"pn\">6<\u002Fdiv><div class=\"line\"><\u002Fdiv><\u002Fdiv>\n                <div class=\"pbody\">\n                  <div class=\"phead\"><p class=\"pt\">Snowflake Execution<\u002Fp><span class=\"src\">Snowflake<\u002Fspan><\u002Fdiv>\n                  <p>Executes validated SQL (10s timeout, 50-row preview, 50K-row CSV export). Connection pooling enabled.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"pstep\">\n                <div class=\"rail\"><div class=\"pn\">7<\u002Fdiv><\u002Fdiv>\n                <div class=\"pbody\">\n                  <div class=\"phead\"><p class=\"pt\">Response Assembly<\u002Fp><\u002Fdiv>\n                  <p>Wraps results into <code style=\"font-family:var(--mono);\">PipelineResponse<\u002Fcode>: <code style=\"font-family:var(--mono);\">{ question, answer, sql, data, row_count, extraction, latency_ms }<\u002Fcode> and returns to the browser client.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"steps\">4.2 &nbsp;Step Details<\u002Fh3>\n\n        <h3 class=\"h\" style=\"font-size:20px; margin-top:40px;\">Step 1 — Intent Extraction <span class=\"tag\">core/intent_extractor.py<\u002Fspan><\u002Fh3>\n        <p class=\"body\">Parses the natural-language question to detect KPI identity, named entities, and aggregation modifiers using in-memory term dictionaries loaded from Neo4j at startup.<\u002Fp>\n        <ul class=\"clean\">\n          <li><strong>Station codes:<\u002Fstrong> exact 3–4 character matching.<\u002Fli>\n          <li><strong>KPI synonyms:<\u002Fstrong> fuzzy matching via <code class=\"inl\">rapidfuzz<\u002Fcode> (partial_ratio scorer).<\u002Fli>\n          <li><strong>Other entities:<\u002Fstrong> exact-first with fuzzy fallback.<\u002Fli>\n          <li><strong>If no KPI matches:<\u002Fstrong> pipeline halts and returns a list of available KPIs.<\u002Fli>\n        <\u002Ful>\n\n        <h3 class=\"h\" style=\"font-size:20px;\">Step 2 — KPI Recipe Lookup <span class=\"tag\">core/ontology_lookup.py<\u002Fspan><\u002Fh3>\n        <p class=\"body\">Queries Neo4j using the detected <code class=\"inl\">kpi_id<\u002Fcode>. Retrieves the full recipe: formula, required views, ordered computation steps, and filter definitions via a Cypher <code class=\"inl\">MATCH<\u002Fcode> traversal.<\u002Fp>\n\n        <h3 class=\"h\" style=\"font-size:20px;\">Step 3 — Context Building <span class=\"tag\">core/context_builder.py<\u002Fspan><\u002Fh3>\n        <p class=\"body\">Merges the extraction result and KPI recipe into a <code class=\"inl\">StructuredContext<\u002Fcode>. Key operations:<\u002Fp>\n        <ul class=\"clean\">\n          <li>Resolves view names against <code class=\"inl\">views.yaml<\u002Fcode> (guards against stale Neo4j data).<\u002Fli>\n          <li>Attaches column names, types, and descriptions for each view.<\u002Fli>\n          <li>Translates detected terms into ready-to-use SQL WHERE clause fragments.<\u002Fli>\n          <li>Raises an error <strong>before<\u002Fstrong> reaching the LLM if an unsupported filter is requested.<\u002Fli>\n        <\u002Ful>\n\n        <h3 class=\"h\" style=\"font-size:20px;\">Step 4 — LLM SQL Generation <span class=\"tag\">core/sql_generator.py<\u002Fspan><\u002Fh3>\n        <p class=\"body\">Sends the <code class=\"inl\">StructuredContext<\u002Fcode> to Azure OpenAI. The LLM operates at <code class=\"inl\">temperature=0.0<\u002Fcode> and is constrained by a strict system prompt: use only provided views and columns, fully qualify all names, no <code class=\"inl\">SELECT *<\u002Fcode>.<\u002Fp>\n        <ul class=\"clean\">\n          <li>Post-processing strips markdown code fences from the response.<\u002Fli>\n          <li><code class=\"inl\">_enforce_view_names()<\u002Fcode> corrects any truncated or incorrect view names.<\u002Fli>\n        <\u002Ful>\n\n        <h3 class=\"h\" style=\"font-size:20px;\">Step 5 — SQL Validation <span class=\"tag\">core/sql_validator.py<\u002Fspan><\u002Fh3>\n        <p class=\"body\">Validates the generated SQL <strong>before any Snowflake connection is made<\u002Fstrong>:<\u002Fp>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th style=\"width:26%;\">Check<\u002Fth><th>What It Catches<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td class=\"rl\">Safety<\u002Ftd><td>Blocks <code class=\"inl\">DROP<\u002Fcode>, <code class=\"inl\">DELETE<\u002Fcode>, <code class=\"inl\">INSERT<\u002Fcode>, <code class=\"inl\">UPDATE<\u002Fcode>, <code class=\"inl\">GRANT<\u002Fcode>, <code class=\"inl\">ALTER<\u002Fcode>, <code class=\"inl\">TRUNCATE<\u002Fcode>.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Schema Compliance<\u002Ftd><td>Every table referenced must exist in the allowed-views list.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Row-Level Security<\u002Ftd><td>If user has a role, SQL must include <code class=\"inl\">STATIONCODE IN (...)<\u002Fcode> for authorized stations.<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" style=\"font-size:20px;\">Step 6 — Snowflake Execution <span class=\"tag\">core/snowflake_executor.py<\u002Fspan><\u002Fh3>\n        <p class=\"body\">Executes the validated SQL against Snowflake using connection pooling. Configuration:<\u002Fp>\n        <ul class=\"clean\">\n          <li><strong>Query timeout:<\u002Fstrong> 10 seconds.<\u002Fli>\n          <li><strong>Preview limit:<\u002Fstrong> 50 rows (API response payload).<\u002Fli>\n          <li><strong>Maximum rows:<\u002Fstrong> 50,000 (CSV export).<\u002Fli>\n        <\u002Ful>\n\n        <h3 class=\"h\" style=\"font-size:20px;\">Step 7 — Response Assembly <span class=\"tag\">core/pipeline.py<\u002Fspan><\u002Fh3>\n        <p class=\"body\">Wraps all outputs into a <code class=\"inl\">PipelineResponse<\u002Fcode> containing: question, answer summary, generated SQL, result data, row count, full extraction result, and per-step latency breakdown in milliseconds.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- ═══════════ 5 · SNOWFLAKE VIEWS ═══════════ -->\n      <section class=\"doc\" id=\"views\">\n        <div class=\"sec-eyebrow\">Section 5 · Phase 1<\u002Fdiv>\n        <h2 class=\"h\"><span class=\"secnum\">05<\u002Fspan>Snowflake Views<\u002Fh2>\n        <p class=\"body\">The system references four pre-defined Snowflake views. All queries are scoped to these views; no ad-hoc table access is permitted.<\u002Fp>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th>View Name<\u002Fth><th class=\"center\" style=\"width:10%;\">Alias<\u002Fth><th class=\"center\" style=\"width:11%;\">Columns<\u002Fth><th style=\"width:40%;\">Purpose<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td class=\"mono\">DIMFINANCEBUSINESSSTRUCTURE_V<\u002Ftd><td class=\"center\"><code class=\"inl\">b<\u002Fcode><\u002Ftd><td class=\"center\">25<\u002Ftd><td>Org hierarchy: Region → Station → Customer → Contract.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">AGGEMPCOUNT_ATTRITION_DATA_V<\u002Ftd><td class=\"center\"><code class=\"inl\">a<\u002Fcode><\u002Ftd><td class=\"center\">5<\u002Ftd><td>Pre-aggregated attrition / turnover metrics.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">DIMHISTORYEMPLOYEE_V<\u002Ftd><td class=\"center\"><code class=\"inl\">e<\u002Fcode><\u002Ftd><td class=\"center\">34<\u002Ftd><td>Employee dimension: headcount, hire / term dates, status.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">FACTDAILYWORKDETAILS_MS_V<\u002Ftd><td class=\"center\"><code class=\"inl\">w<\u002Fcode><\u002Ftd><td class=\"center\">11<\u002Ftd><td>Daily work hours and punch detail.<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n\n        <h3 class=\"h\" id=\"joins\">5.1 &nbsp;Join Paths<\u002Fh3>\n        <p class=\"body\">Three join paths connect the views. The fact table joins to the employee dimension, which in turn joins to the finance / org hierarchy view.<\u002Fp>\n\n        <!-- JOIN DIAGRAM -->\n        <div class=\"figure\">\n          <div class=\"figcap\"><span class=\"fn\">Figure 5.1<\u002Fspan> View join topology<\u002Fdiv>\n          <div class=\"fig-inner\">\n            <div class=\"dgrid\" style=\"grid-template-columns:1fr auto 1fr auto 1fr;\">\n              <div class=\"node\">\n                <div class=\"role\">Fact<\u002Fdiv>\n                <p class=\"nt\" style=\"font-family:var(--mono);font-size:13.5px;\">FACTDAILYWORKDETAILS_MS_V<\u002Fp>\n                <div class=\"ns\">alias <code style=\"font-family:var(--mono);\">w<\u002Fcode> · 11 cols<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"conn\"><span class=\"lab\" style=\"text-align:center;\">w.EMPLOYEE_ID =<br>e.EMPLOYEE_ID<\u002Fspan><svg viewBox=\"0 0 30 18\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div class=\"node red\">\n                <div class=\"role\">Dimension<\u002Fdiv>\n                <p class=\"nt\" style=\"font-family:var(--mono);font-size:13.5px;\">DIMHISTORYEMPLOYEE_V<\u002Fp>\n                <div class=\"ns\">alias <code style=\"font-family:var(--mono);\">e<\u002Fcode> · 34 cols<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"conn\"><span class=\"lab\" style=\"text-align:center;\">e.COSTCENTER =<br>b.COSTCENTER<\u002Fspan><svg viewBox=\"0 0 30 18\"><path d=\"M1 9h22M19 3l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div class=\"node\">\n                <div class=\"role\">Hierarchy<\u002Fdiv>\n                <p class=\"nt\" style=\"font-family:var(--mono);font-size:13.5px;\">DIMFINANCEBUSINESSSTRUCTURE_V<\u002Fp>\n                <div class=\"ns\">alias <code style=\"font-family:var(--mono);\">b<\u002Fcode> · 25 cols<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:24px; padding-top:22px; border-top:1px dashed var(--hair); display:flex; align-items:center; gap:20px; flex-wrap:wrap;\">\n              <div class=\"node blue\" style=\"min-width:280px; flex:0 0 auto;\">\n                <div class=\"role\">Standalone · pre-aggregated<\u002Fdiv>\n                <p class=\"nt\" style=\"font-family:var(--mono);font-size:13.5px;\">AGGEMPCOUNT_ATTRITION_DATA_V<\u002Fp>\n                <div class=\"ns\">alias <code style=\"font-family:var(--mono);\">a<\u002Fcode> · 5 cols<\u002Fdiv>\n              <\u002Fdiv>\n              <span class=\"ns\" style=\"max-width:42ch; flex:1;\">Pre-aggregated attrition / turnover metrics — queried directly; no join required.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th style=\"width:34%;\">From View (Alias)<\u002Fth><th>Join Condition<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td class=\"mono\">FACTDAILYWORKDETAILS_MS_V&nbsp;&nbsp;(w)<\u002Ftd><td><code class=\"inl\">w.EMPLOYEE_ID = e.EMPLOYEE_ID<\u002Fcode> &nbsp;→&nbsp; DIMHISTORYEMPLOYEE_V (e)<\u002Ftd><\u002Ftr>\n              <tr><td class=\"mono\">DIMHISTORYEMPLOYEE_V&nbsp;&nbsp;(e)<\u002Ftd><td><code class=\"inl\">e.COSTCENTER = b.COSTCENTER<\u002Fcode> &nbsp;→&nbsp; DIMFINANCEBUSINESSSTRUCTURE_V (b)<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═══════════ 6 · DESIGN DECISIONS ═══════════ -->\n      <section class=\"doc\" id=\"decisions\">\n        <div class=\"sec-eyebrow\">Section 6<\u002Fdiv>\n        <h2 class=\"h\"><span class=\"secnum\">06<\u002Fspan>Key Design Decisions<\u002Fh2>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th style=\"width:32%;\">Design Decision<\u002Fth><th>Rationale<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td class=\"rl\">YAML as Source of Truth<\u002Ftd><td>Human-readable, version-controllable, reviewable in PRs; single place to update the ontology.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Neo4j as Runtime Store<\u002Ftd><td>Graph traversal enables recipe lookup; designed for future multi-hop join path discovery.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Dictionary-based Intent Extraction<\u002Ftd><td>Fast (~1ms), deterministic, zero LLM cost for intent detection; no hallucination risk.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">LLM Only for SQL Generation<\u002Ftd><td>Constrained role — assembles SQL from pre-validated components; cannot invent columns or tables.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Pre-built WHERE Clauses<\u002Ftd><td>Filters constructed in Python, not by the LLM — eliminates SQL injection risk entirely.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">views.yaml as Local Registry<\u002Ftd><td>Guards against stale Neo4j data; canonical view names always resolved from local file.<\u002Ftd><\u002Ftr>\n              <tr><td class=\"rl\">Delete &amp; Reload Seeding<\u002Ftd><td>Idempotent; handles renames; no complex migration / diff logic; full seed completes in ~10 seconds.<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═══════════ 7 · ADDING A NEW KPI ═══════════ -->\n      <section class=\"doc\" id=\"add-kpi\">\n        <div class=\"sec-eyebrow\">Section 7<\u002Fdiv>\n        <h2 class=\"h\"><span class=\"secnum\">07<\u002Fspan>Adding a New KPI<\u002Fh2>\n\n        <div class=\"callout green\">\n          <span class=\"label\">No Python code changes required<\u002Fspan>\n          <p>New KPIs are added entirely through YAML configuration. After seeding the ontology and restarting the server, the new KPI is immediately available to users.<\u002Fp>\n        <\u002Fdiv>\n\n        <p class=\"body\">Follow these steps in order when adding a new KPI:<\u002Fp>\n        <div class=\"tablewrap\">\n          <table class=\"tbl\">\n            <thead><tr><th class=\"center\" style=\"width:8%;\">#<\u002Fth><th style=\"width:50%;\">Action<\u002Fth><th>File(s) to Edit<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td><span class=\"stepn\">1<\u002Fspan><\u002Ftd><td class=\"rl\">Create or edit the KPI recipe<\u002Ftd><td class=\"mono\">ontology/kpis/your_domain.yaml<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">2<\u002Fspan><\u002Ftd><td class=\"rl\">Add view definitions (if using new views)<\u002Ftd><td class=\"mono\">ontology/schema/views.yaml<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">3<\u002Fspan><\u002Ftd><td class=\"rl\">Add join paths (if multi-view query needed)<\u002Ftd><td class=\"mono\">ontology/schema/joins.yaml<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">4<\u002Fspan><\u002Ftd><td class=\"rl\">Add synonyms and term mappings<\u002Ftd><td class=\"mono\">ontology/schema/terms.yaml<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">5<\u002Fspan><\u002Ftd><td class=\"rl\">Add disambiguation rules (if terms are ambiguous)<\u002Ftd><td class=\"mono\">ontology/schema/disambiguation.yaml<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">6<\u002Fspan><\u002Ftd><td class=\"rl\">Seed the ontology into Neo4j<\u002Ftd><td class=\"mono ink\">python -m scripts.seed_ontology<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">7<\u002Fspan><\u002Ftd><td class=\"rl\">Restart the application server<\u002Ftd><td>FastAPI process restart<\u002Ftd><\u002Ftr>\n              <tr><td><span class=\"stepn\">8<\u002Fspan><\u002Ftd><td class=\"rl\">Test with representative user questions<\u002Ftd><td class=\"mono ink\">POST /api/ask<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- FOOTER -->\n      <div class=\"docfoot\">\n        <div><span class=\"dot\"><\u002Fspan>Unifi KPI Ontology-Enabled Chatbot · Architecture &amp; Flow Document<\u002Fdiv>\n        <div>iLink Digital · v1.0 · Confidential<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<!-- thumbnail for bundler -->\n\n\n<script>\n// Scroll-spy for sidebar TOC\n(function () {\n  const links = Array.from(document.querySelectorAll('#toc a'));\n  const map = new Map();\n  links.forEach(a => { const el = document.getElementById(a.dataset.target); if (el) map.set(el, a); });\n  const targets = Array.from(map.keys());\n\n  function onScroll() {\n    const top = 120;\n    let current = targets[0];\n    for (const el of targets) {\n      if (el.getBoundingClientRect().top <= top) current = el;\n    }\n    links.forEach(a => a.classList.remove('active'));\n    if (current && map.get(current)) map.get(current).classList.add('active');\n  }\n  window.addEventListener('scroll', onScroll, { passive: true });\n  window.addEventListener('resize', onScroll);\n  // smooth scroll\n  links.forEach(a => a.addEventListener('click', e => {\n    const el = document.getElementById(a.dataset.target);\n    if (el) { e.preventDefault(); window.scrollTo({ top: el.offsetTop - 76, behavior: 'smooth' }); }\n  }));\n  onScroll();\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
